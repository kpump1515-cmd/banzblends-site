<\!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | BanzBlends</title>
<style>

:root{
  --red:#c1272d; --blue:#7d8794; --gold:#e8b647; --ink:#000000; --cream:#f2f2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}

/* barber pole stripe bars */
.pole{height:8px;background:repeating-linear-gradient(115deg,
  #000 0 22px,var(--gold) 22px 34px,#000 34px 56px,#8d8d8d 56px 66px);
  box-shadow:0 0 18px rgba(232,182,71,.25)}

header{position:relative;text-align:center;padding:64px 20px 54px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#151515 0%,#0a0a0a 45%,#000 100%)}
header:before,header:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(80px);opacity:.35}
header:before{background:#3a3a3a;top:-90px;left:-70px}
header:after{background:#5a4a1e;bottom:-110px;right:-70px}
header>*{position:relative;z-index:1}
.logo{font-size:clamp(40px,9vw,88px);letter-spacing:4px;font-weight:900;
  background:linear-gradient(180deg,#fff 0%,var(--gold) 60%,#8a6512 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(245,196,69,.18)}
.tag{margin-top:10px;font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
.loc{margin-top:8px;font-size:13px;letter-spacing:2px;color:#8d8d8d}
.icons{margin:18px auto 0;display:flex;justify-content:center;align-items:flex-start;gap:0;
  max-width:640px;padding:0;overflow:visible;background:transparent;box-shadow:none;position:relative}
.icons:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:55%;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.85) 65%,#000 100%)}
.icons .item{width:34%;aspect-ratio:1/1;object-fit:cover;display:block;border:0;border-radius:0;
  mix-blend-mode:screen;opacity:.92;
  -webkit-mask-image:radial-gradient(ellipse 62% 62% at 50% 45%,#000 40%,rgba(0,0,0,.45) 70%,transparent 100%);
  mask-image:radial-gradient(ellipse 62% 62% at 50% 45%,#000 40%,rgba(0,0,0,.45) 70%,transparent 100%)}
.icons .item:nth-child(1){transform:translateY(0) translateX(14px)}
.icons .item:nth-child(2){transform:translateY(26px)}
.icons .item:nth-child(3){transform:translateY(52px) translateX(-14px)}
.icons{padding-bottom:26px}
@media(max-width:600px){.icons{max-width:100%;padding-bottom:14px}
 .icons .item:nth-child(2){transform:translateY(14px)}
 .icons .item:nth-child(3){transform:translateY(28px) translateX(-8px)}}
.cta{display:inline-block;margin-top:22px;padding:16px 36px;border-radius:999px;
  background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;font-weight:800;
  letter-spacing:1.5px;text-decoration:none;font-size:15px;text-transform:uppercase;
  box-shadow:0 10px 26px rgba(232,182,71,.28)}
.cta:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cta.blue{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.cta.gold{background:linear-gradient(135deg,#f5f5f5,#b9b9b9);color:#000;box-shadow:0 10px 26px rgba(255,255,255,.12)}

section{padding:56px 0;scroll-margin-top:70px}
.alt{background:linear-gradient(180deg,#0b0b0b,#000)}
h2{font-size:13px;letter-spacing:5px;text-transform:uppercase;margin-bottom:26px;text-align:center;color:var(--gold)}
h2 .bar{display:block;width:70px;height:3px;margin:12px auto 0;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.prices{max-width:640px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;margin-bottom:10px;
  background:#0c0c0c;border:1px solid #242424;border-left:4px solid var(--gold);border-radius:12px}
.row:nth-child(even){border-left-color:#8d8d8d}
.row:nth-child(3n){border-left-color:var(--red)}
.row .name{letter-spacing:2px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px}
.row .name .thumb{width:44px;height:44px;flex:none;object-fit:cover;border-radius:10px;border:1px solid #2a2a2a}
.row{text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s}
.row:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(232,182,71,.12);background:#141414;border-color:var(--gold)}
.row .go{font-size:11px;letter-spacing:2px;font-weight:800;color:#fdf6e9;background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;padding:7px 12px;border-radius:999px;white-space:nowrap}
.row .price{margin-left:auto;font-size:21px;font-weight:900;color:var(--gold)}

.deposit{max-width:660px;margin:0 auto;border-radius:18px;padding:3px;
  background:linear-gradient(135deg,#2a2a2a,var(--gold),#2a2a2a)}
.deposit-in{background:#0a0a0a;border-radius:15px;padding:32px 26px;text-align:center}
.deposit h3{font-size:28px;letter-spacing:2px;margin-bottom:14px;color:#fff}
.deposit p{color:#b5b5b5;font-size:15px;margin-bottom:10px}
.warn{color:var(--red);font-weight:900;letter-spacing:1px}

.book{text-align:center}
.book p{color:#b5b5b5;margin-bottom:6px}
.script{font-style:italic;font-size:24px;color:var(--gold);letter-spacing:1px;margin-top:22px}
footer{padding:34px 20px 54px;text-align:center;color:#6f6f6f;font-size:13px;letter-spacing:2px}

.corner-pole{position:fixed;top:0;height:100vh;width:86px;z-index:5;pointer-events:none;
  background-repeat:no-repeat;background-position:center top;background-size:contain;
  filter:drop-shadow(0 0 22px rgba(0,0,0,.9))}
.corner-pole.left{left:0}
.corner-pole.right{right:0;transform:scaleX(-1)}
@media(max-width:900px){.corner-pole{width:54px;opacity:.65}}
@media(max-width:600px){.corner-pole{display:none}}

.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:16px 12px;background:#050505;border-bottom:1px solid #1a1a1a;
  position:sticky;top:0;z-index:20}
.tabs a{color:#cfcfcf;text-decoration:none;font-size:11px;letter-spacing:3px;text-transform:uppercase;
  padding:9px 16px;border:1px solid #2a2a2a;border-radius:999px}
.tabs a:hover{color:#000;background:var(--gold);border-color:var(--gold)}
.hours{max-width:620px;margin:0 auto}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;margin-bottom:9px;
  background:#0c0c0c;border:1px solid #242424;border-left:4px solid var(--gold);border-radius:12px;
  letter-spacing:2px;font-size:14px}
.hrow .open{color:var(--gold);font-weight:700}
.hrow .closed{color:#8d8d8d;font-weight:600;letter-spacing:1px;font-size:13px}
.hrow:last-child{border-left-color:#8d8d8d}
.note{max-width:620px;margin:16px auto 22px;text-align:center;color:#8d8d8d;font-size:13px}

.note{max-width:660px;margin:0 auto 20px;text-align:center;color:#8d8d8d;font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;justify-content:flex-start;scrollbar-width:thin}
.day{flex:none;min-width:78px;text-align:center;padding:12px 10px;border-radius:14px;cursor:pointer;
  background:#0c0c0c;border:1px solid #242424;color:#cfcfcf;transition:.15s}
.day b{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8d8d8d}
.day i{display:block;font-style:normal;font-size:21px;font-weight:800;margin-top:4px}
.day small{display:block;font-size:10px;letter-spacing:1px;color:#6f6f6f;margin-top:2px}
.day:hover{border-color:var(--gold)}
.day.active{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;border-color:var(--gold)}
.day.active b,.day.active small{color:#000}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;max-width:760px;margin:6px auto 0}
.slot{display:block;text-align:center;padding:14px 8px;border-radius:12px;text-decoration:none;
  background:#0c0c0c;border:1px solid #242424;border-bottom:3px solid var(--gold);
  color:#f2f2f2;font-weight:700;letter-spacing:1px;font-size:14px;transition:.15s}
.slot:hover{background:var(--gold);color:#000;transform:translateY(-2px)}
.slot.booked{pointer-events:none;background:#070707;color:#5a5a5a;border:1px solid #1c1c1c;
  border-bottom:3px solid #3a3a3a;text-decoration:line-through}
.slot .tag{display:block;margin-top:4px;font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--red);text-decoration:none;font-weight:800}
.slot.gone{opacity:.3;pointer-events:none;text-decoration:line-through;border-bottom-color:#3a3a3a}
.closed-msg{grid-column:1/-1;text-align:center;color:#8d8d8d;padding:18px}
@media(max-width:600px){.days{justify-content:flex-start}}

.modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.88);
  backdrop-filter:blur(4px);overflow-y:auto;padding:24px 12px}
.modal.open{display:block}
.modal-box{position:relative;max-width:860px;margin:0 auto;background:#000;
  border:1px solid #2a2a2a;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.8)}
.modal-box section{padding:40px 0 44px}
.modal-x{position:absolute;top:12px;right:14px;z-index:2;background:transparent;border:1px solid #2a2a2a;
  color:#e8b647;width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.modal-x:hover{background:#e8b647;color:#000}
body.locked{overflow:hidden}

.thanks-box{max-width:560px;margin-top:8vh}
.thanks{padding:44px 28px 40px;text-align:center}
.thanks .check{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;font-size:32px;line-height:64px;font-weight:900}
.thanks h3{font-size:24px;letter-spacing:1px;color:#fff;margin-bottom:14px}
.thanks p{color:#b5b5b5;font-size:15px;margin-bottom:12px}
.thanks .req{color:var(--gold);font-weight:800;letter-spacing:1px;font-size:17px}
.thanks .fine{color:#8d8d8d;font-size:13px;margin-top:16px}
.tagline{color:var(--gold);font-weight:800;letter-spacing:1px;white-space:nowrap}

.form-box{max-width:520px;margin-top:6vh}
.bform{padding:40px 26px 34px}
.bform h3{font-size:23px;letter-spacing:1px;color:#fff;margin-bottom:8px;text-align:center}
.bform .picked{text-align:center;color:var(--gold);font-weight:800;letter-spacing:1px;margin-bottom:14px}
.bform .fine{color:#8d8d8d;font-size:12.5px;margin-bottom:16px;text-align:center}
.bform label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#b5b5b5;margin:14px 0 6px}
.bform input,.bform select,.bform textarea{width:100%;padding:13px 14px;border-radius:11px;background:#0c0c0c;
  border:1px solid #2a2a2a;color:#f2f2f2;font-size:16px;font-family:inherit}
.bform input:focus,.bform select:focus,.bform textarea:focus{outline:none;border-color:var(--gold)}
.bform input.bad,.bform select.bad{border-color:#c1272d}
.bform .err{color:#ff6b6b;font-size:13px;min-height:18px;margin:12px 0 4px;text-align:center}
.bform .cta{display:block;width:100%;text-align:center;margin:4px 0 14px;border:0;cursor:pointer;font-family:inherit;font-size:15px}

.pay-box{max-width:500px;margin-top:7vh}
.pay{padding:40px 26px 34px;text-align:center}
.pay h3{font-size:24px;letter-spacing:1px;color:#fff;margin-bottom:8px}
.pay .picked{color:var(--gold);font-weight:800;letter-spacing:1px;margin-bottom:22px}
.step{display:flex;align-items:center;gap:14px;text-align:left;background:#0c0c0c;border:1px solid #242424;
  border-radius:12px;padding:14px;margin-bottom:12px}
.step.done{border-color:var(--gold)}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;background:#1a1a1a;color:var(--gold);
  font-weight:900;line-height:34px;text-align:center}
.step.done .num{background:linear-gradient(135deg,var(--gold),#b8860b);color:#000}
.step.done .num:after{content:""}
.step .stxt b{display:block;color:#f2f2f2;font-size:15px;letter-spacing:1px}
.step .stxt span{display:block;color:#8d8d8d;font-size:12.5px;margin-top:2px}
.pay .cta{display:block;width:100%;text-align:center;margin:0 0 18px;border:0;cursor:pointer;font-family:inherit;font-size:15px}
.pay .fine{color:#8d8d8d;font-size:12.5px;margin-top:4px}

.gwrap{max-width:1000px;margin:0 auto;padding:0 20px}
.gtop{text-align:center;padding:54px 20px 34px;background:radial-gradient(ellipse at 50% 0%,#151515 0%,#0a0a0a 45%,#000 100%)}
.gtop .logo{font-size:clamp(30px,7vw,58px)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:10px 0 20px}
.gallery figure{background:radial-gradient(circle at 50% 35%,#141414 0%,#000 75%);border:1px solid #1e1e1e;
  border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;min-height:340px}
.gallery img{width:100%;display:block}
.gback{text-align:center;padding:10px 0 60px}
</style>
</head>
